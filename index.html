<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaj_Ka_Offer</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      main {
        text-align: center;
        max-width: 900px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3rem);
      }
      p {
        margin: 0 0 14px;
        font-size: clamp(1.1rem, 2vw, 1.4rem);
        opacity: 0.9;
      }
      .description {
        margin: 0 auto;
        font-size: clamp(0.95rem, 1.4vw, 1.05rem);
        line-height: 1.6;
        opacity: 0.88;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Aaj_Ka_Offer</h1>
      <p>Coming soon</p>
      <p class="description">
        I am building a mobile application (currently in development/beta)
        that provides a short-form, curated "InShorts-style" feed of daily
        deals. My traffic will be organic mobile users interested in deal
        discovery and shopping.
      </p>
    </main>
  </body>
</html>
